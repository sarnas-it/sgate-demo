rules:
  - id: sgate-go-command-injection
    languages: [go]
    message: "Команда собирается из переменной и передаётся в shell — возможна инъекция (CWE-78)."
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern: exec.Command("sh", "-c", $CMD)
          - pattern: exec.Command("bash", "-c", $CMD)

  # 6.3 г): захардкоженные учётные данные. gosec G101 не ловит `const`,
  # поэтому правило добавлено локально и не требует сети.
  - id: sgate-go-hardcoded-credentials
    languages: [go]
    message: "Учётные данные захардкожены в исходном коде (CWE-798)."
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    patterns:
      - pattern-either:
          - pattern: const $NAME = $VALUE
          - pattern: var $NAME = $VALUE
          - pattern: $NAME := $VALUE
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(password|passwd|pwd|secret|token|apikey|api_key|access_key|private_key)$
      # Значение — строковый литерал от 8 символов; маски из одинаковых
      # символов (••••••••, ********) секретом не считаются.
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^"[^"•*]{8,}"$'

  # 6.3 в): индекс среза из недоверенного источника без проверки границ.
  - id: sgate-go-slice-index-from-input
    languages: [go]
    message: "Индекс среза берётся из ввода пользователя без проверки границ (CWE-125)."
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-125: Out-of-bounds Read"
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PathValue(...)
    pattern-sinks:
      - patterns:
          # Только срез: map[$key] с ключом из запроса — не выход за границы.
          - pattern: "($SLICE: []$T)[$IDX]"
          # Помеченным должен быть именно индекс, иначе правило ловит контейнер.
          - focus-metavariable: $IDX
    pattern-propagators:
      - pattern: $OUT, $ERR := strconv.Atoi($IN)
        from: $IN
        to: $OUT
    pattern-sanitizers:
      # Индекс из range по тому же срезу не может выйти за его границы.
      - pattern: for $IDX, $V := range $SLICE { ... }
      - pattern: for $IDX := range $SLICE { ... }
      - pattern: if $IDX < len($SLICE) { ... }
      - pattern: if $IDX >= 0 && $IDX < len($SLICE) { ... }

  # 6.3 а): админский маршрут зарегистрирован без middleware авторизации.
  # 4 из 5 критичных находок шести пилотов SGATE — отсутствие проверки прав:
  # passport-service (сброс пароля и смена ролей без admin), Jxls-report
  # (весь API без auth), TaskTracker (экспорт), api-gateway (per-route auth).
  #
  # Правило ловит регистрацию без With(...): и на «админском» пути напрямую,
  # и внутри блока Route("/…admin…", …). Сам Route не флагится: в
  # passport-service группа /api/admin защищает каждого ребёнка через
  # r.With(adminAuth), и находка на группе была бы ложной.
  #
  # Чего правило НЕ видит: middleware стоит, но роль внутри хендлера не
  # проверяется (как в passport-service: adminAuth есть, а
  # ResetAdminUserPassword не смотрит isAdmin). Это отдельный класс.
  - id: sgate-go-admin-route-without-middleware
    languages: [go]
    message: "Админский маршрут зарегистрирован без middleware авторизации (CWE-862)."
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
    patterns:
      - pattern-either:
          # Прямая регистрация по админскому пути.
          - patterns:
              - pattern-either:
                  - pattern: $R.Get($PATH, ...)
                  - pattern: $R.Post($PATH, ...)
                  - pattern: $R.Put($PATH, ...)
                  - pattern: $R.Delete($PATH, ...)
                  - pattern: $R.Patch($PATH, ...)
              - metavariable-regex:
                  metavariable: $PATH
                  regex: '(?i)^"/[^"]*(admin|manage|console|superuser)[^"]*"$'
          # Ребёнок внутри Route("/…admin…", …) без собственного With.
          - patterns:
              - pattern-either:
                  - pattern: $R.Get($PATH, ...)
                  - pattern: $R.Post($PATH, ...)
                  - pattern: $R.Put($PATH, ...)
                  - pattern: $R.Delete($PATH, ...)
                  - pattern: $R.Patch($PATH, ...)
              - pattern-inside: |
                  $G.Route($APATH, func(...) {
                    ...
                  })
              - metavariable-regex:
                  metavariable: $APATH
                  regex: '(?i)^"/[^"]*(admin|manage|console|superuser)[^"]*"$'
      # With(...) ставит middleware на конкретный маршрут.
      - pattern-not: $R2.With(...).$M($PATH, ...)
      # Use(...) внутри самой админской группы защищает всех её детей.
      # Тип параметра намеренно не указан: роутер может быть chi, gin или
      # собственным интерфейсом — важно только, что middleware ставится.
      - pattern-not-inside: |
          $G3.Route($APATH3, func(...) {
            ...
            $R6.Use(...)
            ...
          })

  # 6.3 а): identity-заголовок принимается без проверки подписи.
  # passport-service доверяет X-User-ID и не проверяет токен (handler.go:58),
  # api-gateway прокидывает X-User-ID/X-User-Signature. При прямом доступе к
  # сервису это имперсонация любого пользователя. Сканеры молчат.
  #
  # Правило не срабатывает, если в той же функции есть проверка подписи
  # (hmacauth.*): этого достаточно для типового middleware, который читает
  # заголовок уже после проверки.
  - id: sgate-go-trusted-identity-header
    languages: [go]
    message: "Identity-заголовок читается без проверки подписи (CWE-290)."
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-290: Authentication Bypass by Spoofing"
    patterns:
      - pattern-either:
          - pattern: $R.Header.Get($H)
          - pattern: $R.Header.Get(...)
      - metavariable-regex:
          metavariable: $H
          regex: '(?i)^"(x-user-id|x-user-email|x-user-roles|x-user-permissions)"$'
      - pattern-not-inside: |
          func $F(...) {
            ...
            hmacauth.$FN(...)
            ...
          }


  # 6.3 г): URL/DSN с учётными данными пишется в лог.
  # broker-cml-etl (main.go:193) и Jxls-report (main.go:116,126) логируют
  # nats_url целиком, включая user:password@. Guardrail ищет секреты в коде,
  # но не в вызовах логирования.
  - id: sgate-go-credentials-in-log
    languages: [go]
    message: "URL/DSN с учётными данными попадает в лог (CWE-532)."
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
    patterns:
      - pattern-either:
          - pattern: $L.Info(..., zap.String($K, $V), ...)
          - pattern: $L.Error(..., zap.String($K, $V), ...)
          - pattern: $L.Warn(..., zap.String($K, $V), ...)
          - pattern: $L.Debug(..., zap.String($K, $V), ...)
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)"(url|dsn|nats_url|db_url|database_url|connection_string)"'
      # Маскировка в аргументе снимает находку: maskURL/redact/sanitize/hostOnly.
      - pattern-not-regex: '(?i)\b(mask|redact|sanitize|hostOnly|scrub)[A-Za-z]*\s*\('

  # 6.3 б): SQL-запрос с табличной функцией, которая ходит в сеть или читает
  # файлы. Jxls-report исполняет пользовательский SQL и разрешает url() в
  # ClickHouse — SSRF во внутреннюю сеть (воспроизведено на стенде).
  - id: sgate-go-sql-dangerous-function
    languages: [go]
    message: "В SQL используется табличная функция с доступом к сети или файлам (CWE-918)."
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
    patterns:
      - pattern: $QUERY
      - metavariable-regex:
          metavariable: $QUERY
          regex: '(?is)^"(?=[^"]*\b(select|from|join|with)\b)[^"]*\b(url|file|s3|remote|remoteSecure|dblink|pg_read_file|pg_read_binary_file)\s*\([^"]*"$'

  # 6.3 а): идентичность продюсера берётся из payload без проверки подписи.
  # broker-cml-etl: client_id читается из JSON и используется для выбора
  # организации и фильтра удаления; подписи нет — любой держатель кредов
  # брокера пишет и удаляет от чужого имени.
  #
  # Правило ловит использование ClientID/TenantID в функции, которая
  # декодировала сообщение, если в ней нет проверки подписи (Verify).
  - id: sgate-go-message-identity-without-signature
    languages: [go]
    message: "Идентичность продюсера берётся из payload без проверки подписи (CWE-290)."
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-290: Authentication Bypass by Spoofing"
    patterns:
      - pattern-either:
          - pattern: $MSG.ClientID
          - pattern: $MSG.TenantID
      - pattern-inside: |
          func $F(...) error {
            ...
            json.Unmarshal(...)
            ...
          }
      - pattern-not-inside: |
          func $F(...) error {
            ...
            $V.Verify(...)
            ...
          }

  # 6.3 б): ошибка записи возвращается как временная.
  # broker-cml-etl: постоянная ошибка (тип поля, неизвестная сущность)
  # возвращается наверх, Watermill делает ретраи, затем Nack — сообщение
  # доставляется вечно и занимает слот. 16 таких сообщений останавливают
  # конвейер (воспроизведено на стенде).
  #
  # Правило не отличает permanent от transient — это и есть предмет проверки:
  # без классификации ошибок и DLQ любая ошибка записи уходит в бесконечный
  # retry.
  - id: sgate-go-broker-write-error-retry
    languages: [go]
    message: "Ошибка записи возвращается как временная: постоянные ошибки уйдут в бесконечный retry, нужен DLQ (CWE-703)."
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-703: Improper Check or Handling of Exceptional Conditions"
    patterns:
      - pattern: |
          if $ERR := $W.Write(...); $ERR != nil {
            ...
            return $ERR
          }
