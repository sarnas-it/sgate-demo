# Политика пилота: секреты и ПДн останавливают пайплайн.
# Значения находок маскируются; полный текст — только при GUARDRAIL_REVEAL=1.
severity:
  aws_access_key: block
  generic_api_key: block
  phone_ru: block
  email: block
  inn_ru: block
  snils_ru: block
  passport_ru: block

ignore:
  paths:
    - "testdata/**"
    - "docs/**"
  matches:
    - rule: phone_ru
      path: "scripts/**"
      reason: "телефоны в демонстрационных командах"

scan:
  max_file_size_kb: 512

output:
  sarif_file: guardrail.sarif
