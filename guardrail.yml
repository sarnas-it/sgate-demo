severity:
  # секреты блокируют, ПДн — предупреждают (значение по умолчанию)
  aws_access_key: block
  generic_api_key: block

ignore:
  paths:
    - "testdata/**"
    - "docs/**"
  matches:
    - rule: phone_ru
      path: "scripts/**"
      reason: "телефоны в демонстрационных командах"

scan:
  max_file_size_kb: 512

output:
  sarif_file: guardrail.sarif
