name: sgate-core

on:
  pull_request:
    paths:
      - "core/**"
      - "dast/**"
      - "analyzers/**"
      - "go.work"
      - "docs/adr/**"
      - "sast-rules/**"
      - "fixtures/sast-rules/**"
      - "scripts/check-pins.sh"
      - "scripts/check-rules.sh"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "dast/**"
      - "analyzers/**"
      - "go.work"
      - "docs/adr/**"
      - "sast-rules/**"
      - "fixtures/sast-rules/**"
      - "scripts/check-pins.sh"
      - "scripts/check-rules.sh"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Check pinned images
        run: ./scripts/check-pins.sh
      - name: Test and vet
        run: |
          cd core
          go test ./...
          go vet ./...
      # Анализаторы — отдельные модули: у них свои тесты и свой go.mod.
      - name: Test analyzers
        run: |
          cd analyzers/ast
          go test ./...
          go vet ./...
      # Второй AST-модуль на другом языке: тот же контракт, другой рантайм.
      - name: Test Python analyzer
        run: |
          cd analyzers/astpy
          python3 -m unittest discover -s tests -t .

  # Правила SAST проверяются на фикстурах с аннотациями ruleid:/ok:.
  # Без этого слишком широкое правило начинает шуметь на защищённом коде,
  # а слишком узкое — молча перестаёт ловить (оба случая были в пилотах).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SAST rules against fixtures
        run: ./scripts/check-rules.sh
