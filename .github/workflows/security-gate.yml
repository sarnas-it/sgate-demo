name: security-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Слой 1: секреты и ПДн. Контейнер запускается без сети.
  secrets:
    name: guardrail (secrets/PII)
    runs-on: [self-hosted, linux, sgate-demo]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for secrets and personal data
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          docker run --rm --network none \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            -e INPUT_BASE="$BASE" \
            -e INPUT_HEAD="${{ github.sha }}" \
            -e INPUT_CONFIG=guardrail.yml \
            ghcr.io/sarnas-it/guardrail:v0.1.0 scan

  # Слой 2: зависимости. Офлайн-пакет баз, сеть не используется.
  # На раннере установлен бинарник deps (см. docs/03-runbook.md).
  sca:
    name: deps (SCA, offline)
    runs-on: [self-hosted, linux, sgate-demo]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan dependencies against offline dataset
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          PUB="$(cat fixtures/osv-dataset/pubkey.hex)"
          deps scan \
            --repo . \
            --base "$BASE" \
            --head "${{ github.sha }}" \
            --dataset fixtures/osv-dataset \
            --pubkey-hex "$PUB" \
            --max-age 87600h \
            --min-severity HIGH \
            --json sca.json \
            --markdown
          python3 scripts/policy.py sca.json
