name: security-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Слой 1: секреты и ПДн. Контейнер запускается без сети.
  secrets:
    name: guardrail (secrets/PII)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for secrets and personal data
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          docker run --rm --network none \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            -e INPUT_BASE="$BASE" \
            -e INPUT_HEAD="${{ github.sha }}" \
            -e INPUT_CONFIG=guardrail.yml \
            ghcr.io/sarnas-it/guardrail:v0.1.0 scan

  # Слой 2: зависимости. Офлайн-пакет баз, сеть не используется.
  sca:
    name: deps (SCA, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download deps binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download demo-tools-v1 \
            --repo sarnas-it/sgate-demo \
            --pattern deps-linux-amd64 \
            --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/deps-linux-amd64"

      - name: Scan dependencies against offline dataset
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          PUB="$(cat fixtures/osv-dataset/pubkey.hex)"
          "$RUNNER_TEMP/deps-linux-amd64" scan \
            --repo . \
            --base "$BASE" \
            --head "${{ github.sha }}" \
            --dataset fixtures/osv-dataset \
            --pubkey-hex "$PUB" \
            --max-age 87600h \
            --min-severity HIGH \
            --json "$RUNNER_TEMP/sca.json" \
            --markdown

          # Политика встроена в workflow и не берётся из PR: публичный PR
          # не должен иметь возможности подменить проверку.
          python3 - "$RUNNER_TEMP/sca.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          blocking = [
              (p.get("name"), p.get("version"), a.get("severity"), a.get("id"))
              for p in (report.get("vulnerable") or [])
              for a in (p.get("advisories") or [])
              if a.get("severity") in {"CRITICAL", "HIGH"}
          ]
          for name, version, severity, advisory in blocking:
              print(f"[BLOCK] {name} {version} — {severity} — {advisory}")
          print(f"итог: {len(blocking)} блокирующих находок", file=sys.stderr)
          raise SystemExit(1 if blocking else 0)
          PY

  # Слой 3: SAST для любых языков через платформу анализаторов SGATE.
  # Semgrep, gosec, Bandit и следующие адаптеры — записи в core/analyzers.yaml.
  sast:
    name: sgate (SAST any language)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Run SGATE analyzers
        run: |
          cd core
          go run ./cmd/sgate --repo .. --config analyzers.yaml --format sarif --block high > "$GITHUB_WORKSPACE/sgate.sarif"

      - name: Upload SGATE SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sgate.sarif
          category: sgate
