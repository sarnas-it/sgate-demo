name: security-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: guardrail (secrets/PII)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for secrets and personal data
        uses: docker://ghcr.io/sarnas-it/guardrail:v0.1.0
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          config: guardrail.yml
          sarif_file: guardrail.sarif

      - name: Upload Guardrail SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: guardrail.sarif
          category: guardrail

  sast:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Слой пилота: правила Semgrep идут из публичного реестра,
      # код в реестр не отправляется (--metrics=off).
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.186.0 \
            semgrep scan \
              --config auto \
              --metrics=off \
              --sarif \
              --output semgrep.sarif \
              --error \
              --exclude node_modules \
              --exclude .next

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  containers:
    name: trivy (containers/IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
