version: 1

# Контракт анализатора: SGATE запускает команду/образ и читает SARIF.
# Новый язык = новый адаптер в этом файле, код SGATE не меняется.
analyzers:
  - id: semgrep
    languages:
      - go
      - php
      - javascript
      - typescript
      - python
      - java
      - ruby
      - rust
      - c
      - cpp
      - csharp
      - kotlin
      - swift
      - scala
    runtime: docker
    image: semgrep/semgrep:1.186.0
    workdir: /src
    command:
      - semgrep
      - scan
      - --config
      - /rules
      - --sarif
      - --output
      - /out/semgrep.sarif
      - --error
      - --metrics=off
      - --quiet
    mounts:
      - source: ../sast-rules
        target: /rules
        read_only: true
    output: /out/semgrep.sarif
    network: none
    timeout: 10m

  # Go-специфичный адаптер. Включается для репозиториев с go.mod.
  - id: gosec
    languages: [go]
    requires: [go.mod]
    runtime: docker
    image: securego/gosec:2.24.6
    workdir: /src
    command:
      - -fmt=sarif
      - -out=/out/gosec.sarif
      - ./...
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
    output: /out/gosec.sarif
    network: none
    timeout: 10m
