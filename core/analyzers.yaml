version: 1

# Fixtures с намеренными уязвимостями не должны блокировать сам SGATE.
exclude:
  - core/testdata/**
  # Фикстуры правил намеренно содержат уязвимый код и аннотации ruleid:/ok:.
  - fixtures/sast-rules/**

# Контракт анализатора: SGATE запускает команду/образ и читает SARIF.
# Новый язык = новый адаптер в этом файле, код SGATE не меняется.
analyzers:
  - id: semgrep
    languages:
      - go
      - php
      - javascript
      - typescript
      - python
      - java
      - ruby
      - rust
      - c
      - cpp
      - csharp
      - kotlin
      - swift
      - scala
    runtime: docker
    image: semgrep/semgrep@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    workdir: /src
    command:
      - semgrep
      - scan
      - --config
      - /rules
      - --sarif
      - --output
      - /out/semgrep.sarif
      - --error
      - --metrics=off
    mounts:
      - source: ../sast-rules
        target: /rules
        read_only: true
    output: /out/semgrep.sarif
    network: none
    # Покрытие: semgrep печатает итог «Ran N rules on M files». Без --quiet
    # эта строка — единственный признак, что скан состоялся: artifacts в
    # SARIF он не заполняет. M=0 или отсутствие строки ⇒ сбой.
    scanned_regex: 'Ran \d+ rules? on (\d+) files'
    scanned_total: true
    min_scanned_files: 1
    timeout: 10m

  # Python-адаптер: Bandit умеет JSON, SGATE нормализует его в общую модель.
  - id: bandit
    languages: [python]
    runtime: docker
    image: cytopia/bandit@sha256:817a97b34d684ae7f6efc6080b6b8b57da86e0fd7154816e9ea10bfffc48ddbd
    workdir: /src
    command:
      - -r
      - .
      - -f
      - json
      - -o
      - /out/bandit.json
      - -q
    output: /out/bandit.json
    format: bandit-json
    network: none
    timeout: 10m

  # PHPStan: статические замечания, JSON в stdout.
  - id: phpstan
    languages: [php]
    requires: [phpstan.neon]
    runtime: docker
    image: ghcr.io/phpstan/phpstan@sha256:a37607d838fa6e25d1debdd0f774021c2be91248e74126c32283c3d6d2ed1a0b
    workdir: /src
    command:
      - analyse
      - --error-format=json
      - --no-progress
      - --configuration=phpstan.neon
    output: /out/phpstan.json
    capture_stdout: true
    format: phpstan-json
    exit_codes: [0, 1]
    network: none
    timeout: 10m

  # PHP-адаптер: Psalm умеет SARIF, но возвращает 2 при находках.
  - id: psalm
    languages: [php]
    requires: [psalm.xml]
    runtime: docker
    image: ghcr.io/psalm/psalm@sha256:aaa6f374af93863832e89d74255f8c44997fbd9244bb66334d19d8ea4f9c285b
    entrypoint: psalm
    workdir: /src
    command:
      - --no-cache
      - --output-format=sarif
      - --taint-analysis
    output: /out/psalm.sarif
    capture_stdout: true
    format: sarif
    exit_codes: [0, 1, 2]
    network: none
    timeout: 10m

  # Go-специфичный адаптер. Включается для репозиториев с go.mod.
  - id: gosec
    languages: [go]
    requires: [go.mod]
    runtime: docker
    image: securego/gosec@sha256:2cf71ea78210c496c65e3a987576a9c8317b68e20f2960520b3f6f8f9f539be5
    workdir: /src
    # -concurrency=1: при параллельном анализе gosec нестабильно теряет часть
    # taint-находок, и сравнение запусков (ГОСТ 8.9) показывает ложные «исчезло».
    command:
      - -concurrency=1
      - -fmt=sarif
      - -out=/out/gosec.sarif
      - ./...
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
    output: /out/gosec.sarif
    network: none
    fail_on:
      - "Golang errors in file"
    # Полнота прогона: gosec печатает строку на каждый открытый файл. Если при
    # нулевом коде таких строк нет — анализ не состоялся, и «0 находок» нельзя
    # отдавать как «чисто» (инцидент на broker-cml-etl: пустой отчёт с кодом 0).
    scanned_regex: 'Checking file: (\S+)'
    min_scanned_files: 1
    timeout: 10m

  # AST-анализатор — отдельный модуль (analyzers/ast), а не часть ядра.
  # Контракт тот же, что у любого анализатора: SGATE_REPO/SGATE_OUT → SARIF,
  # прогресс «ast-scanned: …» для coverage guard. Язык меняется заменой
  # модуля, интерфейс в analyzers.yaml остаётся.
  - id: ast
    languages: [go]
    requires: [go.mod]
    runtime: command
    # Модуль анализатора живёт рядом с конфигом (SGATE_CONFIG_DIR), а
    # анализируется другой репозиторий — поэтому запуск через sh с cd.
    command:
      - sh
      - -c
      - 'cd "$SGATE_CONFIG_DIR/.." && exec go run ./analyzers/ast'
    output: .sgate-ast.sarif
    timeout: 5m
    scanned_regex: 'ast-scanned: (\S+)'
    min_scanned_files: 1

  # Второй AST-модуль — Python. Тот же контракт, другой язык: новый язык
  # подключается отдельным модулем, ядро не меняется.
  - id: astpy
    languages: [python]
    runtime: command
    command:
      - sh
      - -c
      - 'cd "$SGATE_CONFIG_DIR/.." && exec python3 analyzers/astpy/main.py'
    output: .sgate-astpy.sarif
    timeout: 5m
    scanned_regex: 'py-ast-scanned: (\S+)'
    min_scanned_files: 1

  # Межпакетный taint: источник и сток могут быть в разных пакетах
  # (ГОСТ Р 71207-2024, 7.4). Отдельный модуль, контракт тот же.
  - id: taint
    languages: [go]
    requires: [go.mod]
    runtime: command
    command:
      - sh
      - -c
      - 'cd "$SGATE_CONFIG_DIR/.." && exec go run ./analyzers/taint'
    output: .sgate-taint.sarif
    timeout: 5m
    scanned_regex: 'taint-scanned: (\S+)'
    min_scanned_files: 1
