name: sgate-dast

services:
  juice-shop:
    image: bkimminich/juice-shop@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - dast
    read_only: false
    security_opt:
      - no-new-privileges:true

networks:
  dast:
    # Отдельная сеть; порт опубликован только на 127.0.0.1.
    # internal: true не публикует порт на loopback, поэтому оставляем false.
    internal: false
