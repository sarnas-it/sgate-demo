# Контракт DAST-сканера: SGATE запускает контейнер и читает отчёт.
scanners:
  - id: zap-baseline
    image: zaproxy/zap-stable:latest
    workdir: /zap/wrk
    command:
      - zap-baseline.py
      - -t
      - "{{target}}"
      - -J
      - report.json
      - -r
      - report.html
      - -w
      - report.md
      - -I
    output: report.json
    format: zap-json
    network: host
    timeout: 10m
    exit_codes: [0, 1, 2]
