# Контракт DAST-сканера: SGATE запускает контейнер и читает отчёт.
scanners:
  - id: zap-baseline
    image: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    workdir: /zap/wrk
    command:
      - zap-baseline.py
      - -t
      - "{{target}}"
      - -J
      - report.json
      - -r
      - report.html
      - -w
      - report.md
      - -I
    output: /zap/wrk/report.json
    format: zap-json
    network: host
    timeout: 10m
    exit_codes: [0, 1, 2]

  - id: zap-full
    image: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    workdir: /zap/wrk
    command:
      - zap-full-scan.py
      - -t
      - "{{target}}"
      - -J
      - report.json
      - -r
      - report.html
      - -w
      - report.md
      - -I
      - -j
      - -m
      - "2"
      - -z
      - "-config replacer.full_list(0).description=sgate -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).replacement=Bearer {{auth_value}}"
    output: /zap/wrk/report.json
    format: zap-json
    network: host
    timeout: 15m
    exit_codes: [0, 1, 2]

  - id: nuclei
    image: projectdiscovery/nuclei@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb
    workdir: /out
    env:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
    command:
      - -u
      - "{{target}}"
      - -jsonl
      - -o
      - /out/nuclei.jsonl
      - -severity
      - high,critical
      - -silent
      - -no-color
      - -H
      - "{{auth_header}}"
    output: /out/nuclei.jsonl
    format: nuclei-jsonl
    network: host
    timeout: 10m
    exit_codes: [0, 1, 2]

  - id: feroxbuster
    image: epi052/feroxbuster@sha256:ed41806cb9c45bdc01cc8767b68fd47027025570eac8dc2605a024a43a97a873
    workdir: /out
    command:
      - -u
      - "{{target}}"
      - --json
      - -o
      - /out/ferox.json
      - -w
      - /wordlists/common.txt
      - -H
      - "{{auth_header}}"
      - --no-state
      - -q
    mounts:
      - source: wordlists
        target: /wordlists
        read_only: true
    output: /out/ferox.json
    format: ferox-json
    network: host
    timeout: 10m
    exit_codes: [0, 1, 2]
